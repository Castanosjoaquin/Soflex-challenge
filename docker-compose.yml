services:
  copiloto:
    build: .
    image: copiloto-sala:latest
    ports:
      - "8000:8000"
    environment:
      # Defaults to the offline deterministic mode. To use a real LLM, copy
      # .env.example to .env and set LLM_PROVIDER=openai_compat + LLM_API_KEY.
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      LLM_API_KEY: ${LLM_API_KEY:-}
